name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Host (emu + utils + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build emulator and utilities
        run: make emuls utils

      - name: Run unit tests
        run: make utest

  firmware:
    name: Firmware (fntester_pcb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcublog/embedded_gcc_cmake:14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build firmware
        run: make clean && make firmwares

      - name: Get firmware version
        id: fw_version
        run: echo "version=$(bash scripts/get_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: fntester_pcb_${{ steps.fw_version.outputs.version }}
          path: |
            build/output/*.hex
            build/output/*.bin
          if-no-files-found: error
